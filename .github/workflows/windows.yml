name: Windows Desktop

on:
  push:
    branches: ["windows/**"]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Windows app
        run: dotnet build windows/NeoTUN.Windows/NeoTUN.Windows.csproj --configuration Release
      - name: Publish self-contained Windows x64 app
        run: dotnet publish windows/NeoTUN.Windows/NeoTUN.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:AssemblyName=NeoTUN-Windows-x64 -o dist/NeoTUN-Windows
      - name: Prepare standalone EXE and ZIP
        shell: pwsh
        run: |
          $exe = "dist/NeoTUN-Windows/NeoTUN-Windows-x64.exe"
          if (!(Test-Path $exe)) {
            Write-Host "Published files:"
            Get-ChildItem "dist/NeoTUN-Windows" | Select-Object Name, Length
            throw "Published EXE not found: $exe"
          }
          Copy-Item $exe "dist/NeoTUN-Windows-x64.exe" -Force
          Compress-Archive -Path dist/NeoTUN-Windows/* -DestinationPath dist/NeoTUN-Windows-x64.zip -Force
          Get-Item dist/NeoTUN-Windows-x64.exe, dist/NeoTUN-Windows-x64.zip | Select-Object Name, Length
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoTUN-Windows-x64
          path: |
            dist/NeoTUN-Windows-x64.exe
            dist/NeoTUN-Windows-x64.zip
          if-no-files-found: error
      - name: Add Windows files to the main release
        if: github.ref == 'refs/heads/windows/desktop-client'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.6.7
          files: |
            dist/NeoTUN-Windows-x64.exe
            dist/NeoTUN-Windows-x64.zip
