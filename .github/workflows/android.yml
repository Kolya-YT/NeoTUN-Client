name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - "core/**"
      - "xraybridge/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release.yml"
      - "DESIGN_SYSTEM.md"
      - "shared-ui/src/**"
      - "shared-ui/public/**"
      - "shared-ui/index.html"
      - "shared-ui/package.json"
      - "shared-ui/package-lock.json"
      - "shared-ui/vite.config.ts"
      - "shared-ui/tsconfig*.json"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "core/**"
      - "xraybridge/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/release.yml"
      - "DESIGN_SYSTEM.md"
      - "shared-ui/src/**"
      - "shared-ui/public/**"
      - "shared-ui/index.html"
      - "shared-ui/package.json"
      - "shared-ui/package-lock.json"
      - "shared-ui/vite.config.ts"
      - "shared-ui/tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEOTUN_KEYSTORE_BASE64: ${{ secrets.NEOTUN_KEYSTORE_BASE64 }}
      NEOTUN_KEYSTORE_PASSWORD: ${{ secrets.NEOTUN_KEYSTORE_PASSWORD }}
      NEOTUN_KEY_ALIAS: ${{ secrets.NEOTUN_KEY_ALIAS }}
      NEOTUN_KEY_PASSWORD: ${{ secrets.NEOTUN_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shared-ui/package.json

      - name: Build shared UI for Android WebView
        working-directory: shared-ui
        run: |
          npm install --no-audit --no-fund
          npm run build
          mkdir -p ../android/app/src/main/assets/shared-ui
          cp -R dist/. ../android/app/src/main/assets/shared-ui/

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
          cache-dependency-path: xraybridge/go.mod

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-rust-${{ hashFiles('core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Install cargo-ndk (cached)
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      - name: Build Rust core
        working-directory: core
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../android/app/src/main/jniLibs build --release

      - name: Build Xray native engine
        working-directory: xraybridge
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          mkdir -p ../android/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64}
          # go.sum is intentionally generated from the pinned go.mod before compiling.
          go mod tidy

          export GOOS=android
          export CGO_ENABLED=1
          export GOTOOLCHAIN=local
          XRAY_LDFLAGS="-s -w -checklinkname=0"

          GOARCH=arm64 CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
            go build -buildmode=c-shared -trimpath -ldflags="$XRAY_LDFLAGS" \
            -o ../android/app/src/main/jniLibs/arm64-v8a/libneotun_xray.so .

          GOARCH=arm CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang" \
            go build -buildmode=c-shared -trimpath -ldflags="$XRAY_LDFLAGS" \
            -o ../android/app/src/main/jniLibs/armeabi-v7a/libneotun_xray.so .

          GOARCH=amd64 CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang" \
            go build -buildmode=c-shared -trimpath -ldflags="$XRAY_LDFLAGS" \
            -o ../android/app/src/main/jniLibs/x86_64/libneotun_xray.so .

          ls -lh ../android/app/src/main/jniLibs/*/libneotun_xray.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Build signed ABI-specific APKs
        if: ${{ env.NEOTUN_KEYSTORE_BASE64 != '' && env.NEOTUN_KEYSTORE_PASSWORD != '' && env.NEOTUN_KEY_ALIAS != '' && env.NEOTUN_KEY_PASSWORD != '' }}
        working-directory: android
        env:
          NEOTUN_KEYSTORE_PATH: ${{ runner.temp }}/neotun-release.jks
        run: |
          echo "$NEOTUN_KEYSTORE_BASE64" | base64 --decode > "$NEOTUN_KEYSTORE_PATH"
          gradle assembleRelease --no-daemon --parallel --build-cache

      - name: Fail if production signing is not configured
        if: ${{ env.NEOTUN_KEYSTORE_BASE64 == '' || env.NEOTUN_KEYSTORE_PASSWORD == '' || env.NEOTUN_KEY_ALIAS == '' || env.NEOTUN_KEY_PASSWORD == '' }}
        run: |
          echo "::error::Production signing is not configured. Refusing to publish an APK that cannot update an existing installation."
          exit 1

      - name: Prepare and verify APKs
        run: |
          set -euo pipefail
          OUT="android/app/build/outputs/apk/release"
          mkdir -p dist
          cp "$OUT/app-arm64-v8a-release.apk" dist/NeoTUN-arm64-v8a.apk
          cp "$OUT/app-armeabi-v7a-release.apk" dist/NeoTUN-armeabi-v7a.apk
          cp "$OUT/app-x86_64-release.apk" dist/NeoTUN-x86_64.apk
          ls -lh dist/*.apk
          sha256sum dist/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NeoTUN-APKs-v${{ github.run_number }}
          path: dist/*.apk
