name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEOTUN_KEYSTORE_BASE64: ${{ secrets.NEOTUN_KEYSTORE_BASE64 }}
      NEOTUN_KEYSTORE_PASSWORD: ${{ secrets.NEOTUN_KEYSTORE_PASSWORD }}
      NEOTUN_KEY_ALIAS: ${{ secrets.NEOTUN_KEY_ALIAS }}
      NEOTUN_KEY_PASSWORD: ${{ secrets.NEOTUN_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust core
        working-directory: core
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../android/app/src/main/jniLibs build --release

      - name: Download official libXray Android engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p android/app/libs /tmp/libxray
          ASSET="$(gh api repos/XTLS/libXray/releases/tags/v26.9.9 --jq '.assets[].name' | grep -i 'android' | grep -E '\\.zip
      - name: Prepare production signing
        if: ${{ env.NEOTUN_KEYSTORE_BASE64 != '' }}
        run: echo "$NEOTUN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/neotun-release.jks"

      - name: Build APK with production signing
        if: ${{ env.NEOTUN_KEYSTORE_BASE64 != '' && env.NEOTUN_KEYSTORE_PASSWORD != '' && env.NEOTUN_KEY_ALIAS != '' && env.NEOTUN_KEY_PASSWORD != '' }}
        working-directory: android
        env:
          NEOTUN_KEYSTORE_PATH: ${{ runner.temp }}/neotun-release.jks
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Build APK with temporary debug signing
        if: ${{ env.NEOTUN_KEYSTORE_BASE64 == '' || env.NEOTUN_KEYSTORE_PASSWORD == '' || env.NEOTUN_KEY_ALIAS == '' || env.NEOTUN_KEY_PASSWORD == '' }}
        working-directory: android
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoTUN-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK outputs
        working-directory: android
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoTUN-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Read app version
        id: version
        if: github.ref == 'refs/heads/main'
        working-directory: android
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release from main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NeoTUN v${{ steps.version.outputs.version }}
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          make_latest: true
 | head -n1)"
          test -n "$ASSET"
          gh release download v26.9.9 --repo XTLS/libXray --pattern "$ASSET" --dir /tmp/libxray
          unzip -q "/tmp/libxray/$ASSET" -d /tmp/libxray/unpacked
          AAR="$(find /tmp/libxray/unpacked -name 'libXray.aar' -type f | head -n1)"
          test -n "$AAR"
          cp "$AAR" android/app/libs/libXray.aar
          ls -lh android/app/libs/libXray.aar


      - name: Prepare production signing
        if: ${{ env.NEOTUN_KEYSTORE_BASE64 != '' }}
        run: echo "$NEOTUN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/neotun-release.jks"

      - name: Build APK with production signing
        if: ${{ env.NEOTUN_KEYSTORE_BASE64 != '' && env.NEOTUN_KEYSTORE_PASSWORD != '' && env.NEOTUN_KEY_ALIAS != '' && env.NEOTUN_KEY_PASSWORD != '' }}
        working-directory: android
        env:
          NEOTUN_KEYSTORE_PATH: ${{ runner.temp }}/neotun-release.jks
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Build APK with temporary debug signing
        if: ${{ env.NEOTUN_KEYSTORE_BASE64 == '' || env.NEOTUN_KEYSTORE_PASSWORD == '' || env.NEOTUN_KEY_ALIAS == '' || env.NEOTUN_KEY_PASSWORD == '' }}
        working-directory: android
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoTUN-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK outputs
        working-directory: android
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoTUN-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Read app version
        id: version
        if: github.ref == 'refs/heads/main'
        working-directory: android
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release from main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NeoTUN v${{ steps.version.outputs.version }}
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          make_latest: true
