name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust core
        working-directory: core
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../android/app/src/main/jniLibs build --release

      - name: Prepare production signing
        if: env.NEOTUN_KEYSTORE_BASE64 != ''
        env:
          NEOTUN_KEYSTORE_BASE64: ${{ secrets.NEOTUN_KEYSTORE_BASE64 }}
        run: |
          echo "$NEOTUN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/neotun-release.jks"

      - name: Build APK
        working-directory: android
        env:
          NEOTUN_KEYSTORE_PATH: ${{ runner.temp }}/neotun-release.jks
          NEOTUN_KEYSTORE_PASSWORD: ${{ secrets.NEOTUN_KEYSTORE_PASSWORD }}
          NEOTUN_KEY_ALIAS: ${{ secrets.NEOTUN_KEY_ALIAS }}
          NEOTUN_KEY_PASSWORD: ${{ secrets.NEOTUN_KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoTUN-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK outputs
        working-directory: android
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoTUN-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
