name: RIPDPI upstream review

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ripdpi-upstream-review
  cancel-in-progress: false

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NeoTUN
        uses: actions/checkout@v4

      - name: Compare reviewed revision with upstream
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          PINNED="$(sed -n 's/^commit=//p' .github/ripdpi-upstream.lock | head -n1)"
          if [[ ! "$PINNED" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Missing or invalid reviewed RIPDPI commit in .github/ripdpi-upstream.lock"
            exit 1
          fi

          UPSTREAM="$(git ls-remote https://github.com/po4yka/RIPDPI.git refs/heads/main | awk '{print $1}')"
          if [[ ! "$UPSTREAM" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve RIPDPI upstream main"
            exit 1
          fi

          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          if [[ "$PINNED" == "$UPSTREAM" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "RIPDPI upstream matches the reviewed revision."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "RIPDPI has new commits; review is required before updating NeoTUN."
          fi

      - name: Open or update a single review issue
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.compare.outputs.pinned }}
          UPSTREAM: ${{ steps.compare.outputs.upstream }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="Review RIPDPI upstream update"
          URL="https://github.com/po4yka/RIPDPI/compare/$PINNED...$UPSTREAM"
          BODY=$(cat <<EOF
          RIPDPI upstream has advanced beyond NeoTUN's reviewed baseline.

          - Reviewed revision: $PINNED
          - Current upstream main: $UPSTREAM
          - Compare changes: $URL

          This is a review reminder only. Do not update the pin or ship upstream code automatically.

          Before updating, audit API compatibility, Rust toolchain/workspace requirements, licenses and third-party notices; then run NeoTUN regression tests and platform-specific network tests.
          EOF
          )

          EXISTING="$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
          fi
