name: NeoTUN Unified Release

on:
  workflow_run:
    workflows:
      - Android APK
      - NeoTUN Windows Desktop
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: neotun-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Android and Windows together
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Find successful builds for this exact commit
        id: builds
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/android.yml/runs?head_sha=${SOURCE_SHA}&branch=main&per_page=100" --jq ".workflow_runs[] | select(.event == \"push\" and .conclusion == \"success\" and .head_sha == \"${SOURCE_SHA}\") | .id" | head -n 1 || true)
          WINDOWS_RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/desktop.yml/runs?head_sha=${SOURCE_SHA}&branch=main&per_page=100" --jq ".workflow_runs[] | select(.event == \"push\" and .conclusion == \"success\" and .head_sha == \"${SOURCE_SHA}\") | .id" | head -n 1 || true)

          if [[ -z "$ANDROID_RUN_ID" || -z "$WINDOWS_RUN_ID" ]]; then
            echo "Both platform builds have not succeeded for ${SOURCE_SHA}; a later workflow completion will retry release publishing."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "android_run_id=$ANDROID_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "windows_run_id=$WINDOWS_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Android run: $ANDROID_RUN_ID"
          echo "Windows run: $WINDOWS_RUN_ID"

      - name: Download Android APKs and Windows installer
        if: steps.builds.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/neotun-android" "$RUNNER_TEMP/neotun-windows" dist
          gh run download "${{ steps.builds.outputs.android_run_id }}" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/neotun-android"
          gh run download "${{ steps.builds.outputs.windows_run_id }}" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/neotun-windows"

          mapfile -t APKS < <(find "$RUNNER_TEMP/neotun-android" -type f -name 'NeoTUN-*.apk' | sort)
          if [[ "${#APKS[@]}" -ne 3 ]]; then
            echo "::error::Expected 3 ABI-specific APKs, found ${#APKS[@]}."
            find "$RUNNER_TEMP/neotun-android" -type f -maxdepth 5 -print
            exit 1
          fi
          for apk in "${APKS[@]}"; do cp "$apk" dist/; done

          SETUP=$(find "$RUNNER_TEMP/neotun-windows" -type f -name 'NeoTUN-Setup-x64.exe' | head -n 1)
          if [[ -z "$SETUP" ]]; then
            echo "::error::Windows installer EXE was not found in the successful Windows build artifact."
            find "$RUNNER_TEMP/neotun-windows" -type f -maxdepth 5 -print
            exit 1
          fi
          cp "$SETUP" dist/
          (cd dist && sha256sum NeoTUN-*.apk NeoTUN-Setup-x64.exe > SHA256SUMS.txt)
          ls -lh dist/

      - name: Create or update the unified GitHub Release
        if: steps.builds.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          if [[ -z "$VERSION" ]]; then
            echo "::error::Unable to read versionName from android/app/build.gradle.kts"
            exit 1
          fi
          TAG="v${VERSION}"
          TITLE="NeoTUN v${VERSION}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/NeoTUN-*.apk dist/NeoTUN-Setup-x64.exe dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/NeoTUN-*.apk dist/NeoTUN-Setup-x64.exe dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "$TITLE" --generate-notes
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --latest
          echo "Published Android APKs and Windows installer together: $TAG"
