name: NeoTUN Windows Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "windows/**"
      - "core/**"
      - "android/**"
      - "xraybridge/**"
      - ".github/workflows/desktop.yml"
      - "installer/**"
      - "README.md"
      - "DESIGN_SYSTEM.md"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the Windows package to (leave empty for CI only)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: windows-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 desktop app and runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test shared Rust core
        run: cargo test --manifest-path core/Cargo.toml

      - name: Build shared Rust core for Windows
        run: cargo build --manifest-path core/Cargo.toml --release --target x86_64-pc-windows-msvc

      - name: Restore Windows UI
        run: dotnet restore windows/NeoTUN.Windows/NeoTUN.Windows.csproj

      - name: Build Windows UI
        run: dotnet build windows/NeoTUN.Windows/NeoTUN.Windows.csproj -c Release --no-restore

      - name: Publish self-contained Windows application
        run: dotnet publish windows/NeoTUN.Windows/NeoTUN.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/NeoTUN-Windows

      - name: Download and stage pinned network engines
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtime = Join-Path (Get-Location) "dist/NeoTUN-Windows/runtime"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          # Cargo's target directory can be affected by workspace-level Cargo config.
          # Locate the exact built DLL instead of assuming a fixed target path.
          $coreDll = Get-ChildItem "." -Filter "neotun_core.dll" -File -Recurse |
            Where-Object { $_.FullName -notmatch "[\\\\/]dist[\\\\/]" -and $_.FullName -match "[\\\\/]x86_64-pc-windows-msvc[\\\\/]release[\\\\/]" } |
            Select-Object -First 1
          if (!$coreDll) {
            $coreDll = Get-ChildItem "core" -Filter "neotun_core.dll" -File -Recurse |
              Where-Object { $_.FullName -notmatch "[\\\\/]dist[\\\\/]" -and $_.FullName -match "[\\\\/]release[\\\\/]" } |
              Select-Object -First 1
          }
          if (!$coreDll) {
            throw "neotun_core.dll was not produced by cargo build. Search paths: $(Get-ChildItem core -Directory | Select-Object -ExpandProperty FullName -Join ', ')"
          }
          Write-Host "Staging shared core from $($coreDll.FullName)"
          Copy-Item $coreDll.FullName "dist/NeoTUN-Windows/neotun_core.dll"

          $temp = Join-Path $env:RUNNER_TEMP "neotun-engines"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null

          function Get-PinnedArchive([string]$Url, [string]$Destination) {
            $lastError = $null
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              try {
                Write-Host "Downloading $Url (attempt $attempt/4)"
                Remove-Item $Destination -Force -ErrorAction SilentlyContinue
                Invoke-WebRequest -Uri $Url -OutFile $Destination -TimeoutSec 120
                if (!(Test-Path $Destination) -or (Get-Item $Destination).Length -lt 1024) {
                  throw "Downloaded archive is missing or unexpectedly small: $Destination"
                }
                return
              } catch {
                $lastError = $_
                Write-Warning "Download attempt $attempt failed: $($_.Exception.Message)"
                if ($attempt -lt 4) { Start-Sleep -Seconds (3 * $attempt) }
              }
            }
            throw "Unable to download pinned runtime asset from $Url. Last error: $lastError"
          }

          $singBoxZip = Join-Path $temp "sing-box.zip"
          Get-PinnedArchive "https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-windows-amd64.zip" $singBoxZip
          Expand-Archive $singBoxZip (Join-Path $temp "sing-box") -Force
          $singBoxExe = Get-ChildItem (Join-Path $temp "sing-box") -Filter "sing-box.exe" -Recurse | Select-Object -First 1
          if (!$singBoxExe) { throw "sing-box.exe missing from pinned upstream archive" }
          Copy-Item $singBoxExe.FullName (Join-Path $runtime "sing-box.exe")
          Get-ChildItem $singBoxExe.DirectoryName -File | Where-Object { $_.Name -ne "sing-box.exe" } | Copy-Item -Destination $runtime -Force

          $xrayZip = Join-Path $temp "xray.zip"
          Get-PinnedArchive "https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-windows-64.zip" $xrayZip
          Expand-Archive $xrayZip (Join-Path $temp "xray") -Force
          $xrayExe = Get-ChildItem (Join-Path $temp "xray") -Filter "xray.exe" -Recurse | Select-Object -First 1
          if (!$xrayExe) { throw "xray.exe missing from pinned upstream archive" }
          Copy-Item $xrayExe.FullName (Join-Path $runtime "xray.exe")
          Get-ChildItem $xrayExe.DirectoryName -File | Where-Object { $_.Name -ne "xray.exe" } | Copy-Item -Destination $runtime -Force

          $wintunZip = Join-Path $temp "wintun.zip"
          Get-PinnedArchive "https://www.wintun.net/builds/wintun-0.14.1.zip" $wintunZip
          $wintunHash = (Get-FileHash $wintunZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($wintunHash -ne "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51") {
            throw "Wintun SHA-256 mismatch: $wintunHash"
          }
          Expand-Archive $wintunZip (Join-Path $temp "wintun") -Force
          $wintunDll = Get-ChildItem (Join-Path $temp "wintun") -Filter "wintun.dll" -Recurse |
            Where-Object { $_.FullName -match "[\\/]amd64[\\/]" } | Select-Object -First 1
          if (!$wintunDll) { throw "amd64 wintun.dll missing from upstream archive" }
          Copy-Item $wintunDll.FullName (Join-Path $runtime "wintun.dll")

          $required = @("neotun_core.dll", "runtime/sing-box.exe", "runtime/xray.exe", "runtime/wintun.dll")
          foreach ($file in $required) {
            if (!(Test-Path (Join-Path "dist/NeoTUN-Windows" $file))) { throw "Required runtime file missing: $file" }
          }
          & (Join-Path $runtime "sing-box.exe") version
          & (Join-Path $runtime "xray.exe") version

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build and verify Windows installer EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = Resolve-Path "dist/NeoTUN-Windows"
          $required = @(
            "NeoTUN.exe",
            "neotun_core.dll",
            "runtime/sing-box.exe",
            "runtime/xray.exe",
            "runtime/wintun.dll"
          )
          foreach ($file in $required) {
            if (!(Test-Path (Join-Path $app $file))) { throw "Required Windows runtime file missing: $file" }
          }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found at $compiler" }
          & $compiler "/DAppVersion=0.1.0" "installer/NeoTUN-Windows.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $setup = "dist/NeoTUN-Setup-x64.exe"
          if (!(Test-Path $setup)) { throw "Installer EXE was not produced" }
          if ((Get-Item $setup).Length -lt 10MB) { throw "Installer is unexpectedly small; runtime payload may be missing" }
          Get-Item $setup | Format-Table Name, Length
          Get-FileHash $setup -Algorithm SHA256 | Format-List

      - name: Upload Windows installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: NeoTUN-Setup-x64
          path: dist/NeoTUN-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach Windows installer to a manually selected release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          files: dist/NeoTUN-Setup-x64.exe
          fail_on_unmatched_files: true
          make_latest: false
          generate_release_notes: false
          token: ${{ secrets.NEOTUN_RELEASE_TOKEN || github.token }}

      - name: Publish Windows installer to the version release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.NEOTUN_RELEASE_TOKEN || github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $versionLine = Select-String -Path "android/app/build.gradle.kts" -Pattern 'versionName = "([^"]+)"' | Select-Object -First 1
          if (!$versionLine -or $versionLine.Matches.Count -eq 0) { throw "Unable to read versionName from Android Gradle config" }
          $version = $versionLine.Matches[0].Groups[1].Value
          $tag = "v$version"
          $setup = "dist/NeoTUN-Setup-x64.exe"
          if (!(Test-Path $setup)) { throw "Windows installer missing: $setup" }

          # Wait for the Android workflow to create the release. If it does not,
          # create the release here and let Android upload its APKs on its next run.
          $releaseFound = $false
          for ($attempt = 1; $attempt -le 36; $attempt++) {
            gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
            if ($LASTEXITCODE -eq 0) { $releaseFound = $true; break }
            Start-Sleep -Seconds 10
          }
          if (!$releaseFound) {
            gh release create $tag $setup --repo "$env:GITHUB_REPOSITORY" --title "NeoTUN $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) {
              gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
              if ($LASTEXITCODE -ne 0) { throw "Could not create/access release $tag. Check NEOTUN_RELEASE_TOKEN and Actions permissions." }
            }
          }
          gh release upload $tag $setup --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload Windows installer to release $tag" }
          Write-Host "Published $setup to release $tag"

      - name: Attach Windows installer when a version tag is pushed
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/NeoTUN-Setup-x64.exe
          fail_on_unmatched_files: true
          make_latest: false
          generate_release_notes: false
          token: ${{ secrets.NEOTUN_RELEASE_TOKEN || github.token }}
