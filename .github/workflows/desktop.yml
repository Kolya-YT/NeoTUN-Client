name: NeoTUN Windows Desktop

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "core/**"
      - ".github/workflows/desktop.yml"
      - "DESIGN_SYSTEM.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 desktop app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore Windows UI
        run: dotnet restore windows/NeoTUN.Windows/NeoTUN.Windows.csproj

      - name: Build Windows UI
        run: dotnet build windows/NeoTUN.Windows/NeoTUN.Windows.csproj -c Release --no-restore

      - name: Publish self-contained Windows application
        run: dotnet publish windows/NeoTUN.Windows/NeoTUN.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/NeoTUN-Windows

      - name: Verify Windows distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = "dist/NeoTUN-Windows/NeoTUN.exe"
          if (!(Test-Path $app)) { throw "Published desktop executable not found: $app" }
          Get-ChildItem "dist/NeoTUN-Windows" | Format-Table Name, Length

      - name: Upload Windows UI
        uses: actions/upload-artifact@v4
        with:
          name: NeoTUN-Windows-x64
          path: dist/NeoTUN-Windows/**
