name: NeoTUN Windows Desktop

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "core/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 desktop app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore Windows UI
        run: dotnet restore windows/NeoTUN.Windows/NeoTUN.Windows.csproj

      - name: Build Windows UI
        run: dotnet build windows/NeoTUN.Windows/NeoTUN.Windows.csproj -c Release --no-restore

      - name: Publish self-contained Windows application
        run: dotnet publish windows/NeoTUN.Windows/NeoTUN.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/NeoTUN-Windows

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build Rust core for Windows
        run: cargo build --release --target x86_64-pc-windows-msvc -p neotun-core

      - name: Copy Windows native core
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binary = "target/x86_64-pc-windows-msvc/release/neotun_core.dll"
          if (!(Test-Path $binary)) {
            throw "Expected native library not found: $binary"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $binary "dist/neotun_core.dll"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload Windows UI
        uses: actions/upload-artifact@v4
        with:
          name: NeoTUN-Windows-x64
          path: |
            dist/NeoTUN-Windows/**
            dist/neotun_core.dll
