name: NeoTUN Windows Desktop

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "core/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 native core (experimental)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build Rust core for Windows
        run: cargo build --release --target x86_64-pc-windows-msvc -p neotun-core

      - name: Package Windows native core
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binary = "target/x86_64-pc-windows-msvc/release/neotun_core.dll"
          if (!(Test-Path $binary)) {
            throw "Expected native library not found: $binary"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $binary "dist/neotun_core.dll"
          @"
          NeoTUN Windows native core (x64) — experimental

          This is only the Rust parsing/configuration library.
          It is NOT a complete Windows client: no desktop UI, TUN adapter,
          Windows service, or integrated Xray/sing-box runtime is included.
          "@ | Set-Content -Encoding utf8 "dist/README-Windows.txt"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoTUN-Windows-Core-x64
          path: dist/*
