name: One-time branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-branches-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    name: Keep only main
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );
            const targets = branches.filter(branch => branch.name !== "main");
            core.info(`Found ${branches.length} branches; deleting ${targets.length}, keeping main.`);
            for (const branch of targets) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch.name}`
                });
                core.info(`Deleted ${branch.name}`);
              } catch (error) {
                core.warning(`Could not delete ${branch.name}: ${error.message}`);
              }
            }
            const remaining = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );
            const names = remaining.map(branch => branch.name);
            core.info(`Remaining branches: ${names.join(", ")}`);
            if (names.some(name => name !== "main")) {
              core.setFailed("Some branches could not be deleted. See warnings above.");
            }
