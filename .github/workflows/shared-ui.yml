name: Shared UI
on:
  push:
    branches: [main]
    paths:
      - 'shared-ui/**'
      - '.github/workflows/shared-ui.yml'
  pull_request:
    paths:
      - 'shared-ui/**'
      - '.github/workflows/shared-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shared-ui/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
